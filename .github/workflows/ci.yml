name: verify
on: [push, pull_request, workflow_dispatch]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- "$(cat .moonbit-version)"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: moon version --all
      - run: moon update
      - run: moon fmt --check
      - run: moon check --target js --deny-warn
      - run: moon check --target wasm-gc --deny-warn
      - run: moon test --target js --deny-warn
      - run: moon test --target wasm-gc --deny-warn
      - run: moon build --target js --release cmd/arrow --deny-warn
      - run: node examples/small-window.mjs
      - run: node examples/status-window.mjs
      - run: moon info
      - run: git diff --exit-code -- '*.mbti'
      - uses: actions/setup-python@v5
        if: github.event_name == 'workflow_dispatch'
        with:
          python-version: '3.12'
      - name: Pinned public recording and independent IPC reader
        if: github.event_name == 'workflow_dispatch'
        run: |
          python -m pip install -r tools/requirements.txt
          mkdir work
          python tools/fetch_sample.py work/source
          node bin/oscbridge.mjs export work/source/sample.cfg work/source/sample.dat work/full.arrow 0 7 20000
          node bin/oscbridge.mjs export work/source/sample.cfg work/source/sample.dat work/window.arrow 1 1.1 10000
          node bin/oscbridge.mjs export work/source/sample.cfg work/source/sample.dat work/empty.arrow 1 1 10000
          python tools/verify_arrow.py --cfg work/source/sample.cfg --dat work/source/sample.dat --archive work/source/Labeled_raw_v1.1.7z --full work/full.arrow --window work/window.arrow --empty work/empty.arrow
          node bin/check-host.mjs work/source/sample.cfg work/source/sample.dat work
          python tools/verify_status_events.py --cfg work/source/sample.cfg --dat work/source/sample.dat --out work/events
